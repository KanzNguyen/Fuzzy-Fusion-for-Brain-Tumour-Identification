version: "3.9"

services:

  # ── FastAPI inference API ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: brain_tumor_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount your model folders into the container.
      # Left side  = path on YOUR machine (edit these!)
      # Right side = path the code expects inside the container
      - ./models/Gompertz:/app/models/Gompertz:ro
      - ./models/Mitscherlich:/app/models/Mitscherlich:ro
      - ./models/SVM:/app/models/SVM:ro
    environment:
      - PYTHONUNBUFFERED=1
    # Uncomment the lines below if you have an NVIDIA GPU + nvidia-container-toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Streamlit frontend ─────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: brain_tumor_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    # When running inside Docker, the UI talks to the API via the service name
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api

networks:
  default:
    name: brain_tumor_net
